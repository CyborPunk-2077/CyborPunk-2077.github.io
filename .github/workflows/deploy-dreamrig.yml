name: Deploy DREAMRIG Portfolio

on:
  push:
    branches:
      - dreamrig-staging-source
    paths:
      - ".dreamrig-upload/trigger.txt"

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged source payload
        uses: actions/checkout@v4
        with:
          ref: dreamrig-staging-source

      - name: Reconstruct and verify DREAMRIG source
        shell: bash
        run: |
          set -euo pipefail
          cat .dreamrig-upload/chunk*.txt | base64 -d > /tmp/dreamrig-src.tar.xz
          echo "ec496f932c406e86942b5d9e9c229945e76c4aa983fbb0826bd4c73870085875  /tmp/dreamrig-src.tar.xz" | sha256sum -c -
          mkdir -p /tmp/dreamrig-src
          tar -xJf /tmp/dreamrig-src.tar.xz -C /tmp/dreamrig-src

      - name: Install and build DREAMRIG
        working-directory: /tmp/dreamrig-src
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish DREAMRIG to GitHub Pages branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/dreamrig-src/dist/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy DREAMRIG portfolio"
          git push origin main
