<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090908">
<title>Abhishek Tiwary — BLACKSITE</title>
<style>
html,body{margin:0;background:#090908;color:#ece9df;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}
#boot{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center;text-transform:uppercase;letter-spacing:.1em}
#detail{display:block;color:#8c8a83;margin-top:12px;text-transform:none;letter-spacing:0;font-size:12px}
</style>
</head>
<body><div id="boot"><div>Loading BLACKSITE…<span id="detail">starting verified Omega</span></div></div>
<script>
(async()=>{
 const boot=document.getElementById('boot'),detail=document.getElementById('detail');
 const core=['core-00.txt','core-01.txt','core-02.txt','core-03.txt','core-04.txt','core-05.txt','core-06.txt','core-07.txt'];
 const assets=['assets-00.txt','assets-01.txt','assets-02.txt','assets-03-00.txt','assets03r00.txt','assets03r01.txt','assets03r02.txt','assets03r03.txt','assets03r04.txt','assets-04.txt','assets-05.txt','assets-06.txt','assets-07.txt','assets-08.txt','assets-09.txt','assets-10.txt'];
 async function unpack(files,label){
   let b64='';
   for(let i=0;i<files.length;i++){
     detail.textContent=`loading ${label} ${i+1}/${files.length}`;
     const r=await fetch(`v3/${files[i]}?omega=10`,{cache:'no-store'});
     if(!r.ok) throw new Error(`${files[i]} HTTP ${r.status}`);
     const part=(await r.text()).replace(/\s+/g,'');
     if(!part || !/^[A-Za-z0-9+/]*={0,2}$/.test(part)) throw new Error(`${files[i]} payload invalid`);
     b64+=part;
   }
   if(b64.length%4!==0) throw new Error(`${label} base64 length invalid`);
   let bin;
   try{bin=atob(b64)}catch(e){throw new Error(`${label} base64 decode failed`)}
   const bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
   if(!('DecompressionStream' in window)) throw new Error('This browser does not support native gzip decompression. Use a current Chrome, Edge, Firefox or Safari.');
   try{
     return await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
   }catch(e){throw new Error(`${label} gzip decode failed`)}
 }
 try{
   const [coreHtml,assetJs]=await Promise.all([unpack(core,'Omega core'),unpack(assets,'Omega images')]);
   if(!coreHtml.includes('Abhishek Tiwary — BLACKSITE')) throw new Error('Omega core verification failed');
   if(!assetJs.includes('window.BLACKSITE_ASSETS')) throw new Error('Omega image verification failed');
   detail.textContent='initializing exact images';
   try{(0,eval)(assetJs)}catch(e){throw new Error('Omega image map initialization failed')}
   detail.textContent='launching BLACKSITE';
   const assetTag='<scr'+'ipt src="assets-lite.js"></scr'+'ipt>';
   const resumeTag='<scr'+'ipt src="resume-lite.js"></scr'+'ipt>';
   const html=coreHtml
     .replace(assetTag,'')
     .replace(resumeTag,'')
     .replaceAll('assets/Abhishek_Tiwary_Resume.pdf','resume.html');
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   console.error(e);
   boot.innerHTML='<div>BLACKSITE LOAD ERROR<span id="detail">'+String(e&&e.message||e)+'</span></div>';
 }
})();
</script>
</body>
</html>
