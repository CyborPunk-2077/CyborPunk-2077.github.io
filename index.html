<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhishek Tiwary — BLACKSITE</title>
<style>
html,body{margin:0;background:#05070a;color:#e7f3f1;font-family:ui-monospace,monospace}
#boot{min-height:100vh;display:grid;place-items:center;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body><div id="boot">Loading BLACKSITE…</div>
<script>
(async()=>{
 try{
   const names=['00','01','02','03','04','05','06'];
   const parts=[];
   for(const n of names){
     const r=await fetch(`payload/site-${n}.txt`,{cache:'no-store'});
     if(!r.ok) throw new Error(`payload ${n}: ${r.status}`);
     parts.push((await r.text()).trim());
   }
   const b64=parts.join('');
   const bin=atob(b64);
   const bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
   const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
   const html=await new Response(stream).text();
   document.open();
   document.write(html);
   document.close();
 }catch(e){
   document.getElementById('boot').textContent='BLACKSITE failed to load — refresh';
   console.error(e);
 }
})();
</script>
</body></html>
