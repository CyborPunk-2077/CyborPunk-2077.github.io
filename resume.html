<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Abhishek Tiwary — Resume</title>
<style>
html,body{margin:0;background:#05070a;color:#e7f3f1;font-family:system-ui,sans-serif}
main{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
small{opacity:.7}
</style>
</head>
<body><main><div><p>Loading resume…</p><small>Abhishek Tiwary</small></div></main>
<script>
(async()=>{
 try{
   const b64=(await fetch('payload/resume.b64',{cache:'no-store'}).then(r=>r.text())).trim();
   const bin=atob(b64), bytes=new Uint8Array(bin.length);
   for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
   const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
   location.replace(url);
 }catch(e){
   document.querySelector('p').textContent='Resume failed to load. Please retry.';
   console.error(e);
 }
})();
</script>
</body></html>
